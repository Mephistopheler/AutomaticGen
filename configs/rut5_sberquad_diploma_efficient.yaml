seed: 42
output_dir: outputs/rut5_sberquad_diploma_efficient
run_validation_generation: true

model:
  name: ai-forever/ruT5-base
  use_fast: false
  use_safetensors: false

data:
  source_template: "generate question: context: {context} answer: {answer}"
  max_source_length: 320
  max_target_length: 56

  train_datasets:
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: train
      language: ru
      dataset_name: sberquad_train_balanced
      max_samples: 20000
      sample_seed: 42

  validation_datasets:
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: validation
      language: ru
      dataset_name: sberquad_validation_balanced
      max_samples: 2000
      sample_seed: 42

  evaluation_datasets:
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: validation
      language: ru
      dataset_name: sberquad_validation_balanced
      max_samples: 2000
      sample_seed: 42

training:
  batch_size: 2
  learning_rate: 3.0e-5
  num_epochs: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.06
  early_stopping_patience: 1
  mixed_precision: auto
  gradient_checkpointing: true
  save_each_epoch: false

generation:
  max_new_tokens: 56
  num_beams: 3
  do_sample: false
  temperature: 1.0
  top_p: 1.0

evaluation:
  language: ru
  bertscore_model_type: bert-base-multilingual-cased