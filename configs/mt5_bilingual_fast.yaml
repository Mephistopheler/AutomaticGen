seed: 42
output_dir: outputs/mt5_bilingual_fast
run_validation_generation: true

model:
  name: google/mt5-small
  use_fast: false
  use_safetensors: false
  tie_word_embeddings: false

data:
  source_template: "generate question in {language}: context: {context} answer: {answer}"
  max_source_length: 256
  max_target_length: 48

  train_datasets:
    - type: hf
      path: rajpurkar/squad
      split: train[:200]
      language: en
      dataset_name: squad_train_fast
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: train[:200]
      language: ru
      dataset_name: sberquad_train_fast

  validation_datasets:
    - type: hf
      path: rajpurkar/squad
      split: validation[:50]
      language: en
      dataset_name: squad_validation_fast
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: validation[:50]
      language: ru
      dataset_name: sberquad_validation_fast

  evaluation_datasets:
    - type: hf
      path: rajpurkar/squad
      split: validation[:50]
      language: en
      dataset_name: squad_validation_fast
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: validation[:50]
      language: ru
      dataset_name: sberquad_validation_fast

training:
  batch_size: 2
  learning_rate: 5.0e-5
  num_epochs: 1
  gradient_accumulation_steps: 2
  warmup_ratio: 0.05
  early_stopping_patience: 1

generation:
  max_new_tokens: 48
  num_beams: 2
  do_sample: false
  temperature: 1.0
  top_p: 1.0

evaluation:
  language: multilingual
  bertscore_model_type: bert-base-multilingual-cased
  bertscore_model_by_language:
    en: bert-base-uncased
    ru: bert-base-multilingual-cased