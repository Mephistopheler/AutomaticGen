seed: 42
output_dir: outputs/mt5_bilingual_finetune
run_validation_generation: true

model:
  name: google/mt5-base
  use_fast: false
  use_safetensors: false
  tie_word_embeddings: false

data:
  # The {language} tag lets one checkpoint learn to emit questions in both
  # English (en) and Russian (ru) instead of relying only on the context text.
  source_template: "generate question in {language}: context: {context} answer: {answer}"
  max_source_length: 384
  max_target_length: 64

  train_datasets:
    - type: hf
      path: rajpurkar/squad
      split: train
      language: en
      dataset_name: squad_train
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: train
      language: ru
      dataset_name: sberquad_train

  validation_datasets:
    - type: hf
      path: rajpurkar/squad
      split: validation
      language: en
      dataset_name: squad_validation
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: validation
      language: ru
      dataset_name: sberquad_validation

  evaluation_datasets:
    - type: hf
      path: rajpurkar/squad
      split: validation
      language: en
      dataset_name: squad_validation
    - type: hf
      path: kuznetsoffandrey/sberquad
      split: validation
      language: ru
      dataset_name: sberquad_validation

training:
  batch_size: 4
  learning_rate: 3.0e-5
  num_epochs: 3
  gradient_accumulation_steps: 4
  warmup_ratio: 0.08
  early_stopping_patience: 2

generation:
  max_new_tokens: 64
  num_beams: 4
  do_sample: false
  temperature: 1.0
  top_p: 1.0

evaluation:
  language: multilingual
  bertscore_model_type: bert-base-multilingual-cased
  bertscore_model_by_language:
    en: bert-base-uncased
    ru: bert-base-multilingual-cased